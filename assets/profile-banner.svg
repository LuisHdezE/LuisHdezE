<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Luis A. Hernández Elias - Software Developer</title>
  <desc id="desc">Dark navy developer banner with matrix-style code, terminal motifs and software engineering visuals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.55" stop-color="#061a33"/>
      <stop offset="1" stop-color="#03101f"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#d9f2ff"/>
      <stop offset="1" stop-color="#39bdf8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="60" height="24" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V24" fill="none" stroke="#0ea5e9" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect x="0" y="210" width="1200" height="90" fill="url(#grid)" opacity="0.9"/>

  <!-- Matrix/code rain -->
  <g fill="#0ea5e9" opacity="0.24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">
    <text x="40" y="18">0 1 1 0 1 0 0 1</text><text x="40" y="31">1 0 0 1 1 0 1 0</text><text x="40" y="44">0 1 0 1 0 1 1 0</text>
    <text x="205" y="14">1 0 1 0 1 1 0 0</text><text x="205" y="27">0 0 1 1 0 1 0 1</text><text x="205" y="40">1 1 0 0 1 0 1 0</text>
    <text x="900" y="16">0 1 0 0 1 1 0 1</text><text x="900" y="29">1 0 1 1 0 0 1 0</text><text x="900" y="42">0 1 1 0 1 0 0 1</text>
    <text x="1080" y="14">1 1 0 1 0 0 1 0</text><text x="1080" y="27">0 1 0 1 1 0 0 1</text><text x="1080" y="40">1 0 1 0 0 1 1 0</text>
  </g>

  <!-- Terminal panel -->
  <g transform="translate(24 28)">
    <rect width="220" height="166" rx="12" fill="#020b18" fill-opacity="0.82" stroke="#0ea5e9" stroke-opacity="0.45"/>
    <circle cx="18" cy="16" r="4" fill="#38bdf8"/><circle cx="32" cy="16" r="4" fill="#2563eb"/><circle cx="46" cy="16" r="4" fill="#0f4c81"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#38bdf8" opacity="0.85">
      <text x="16" y="42">// Build</text><text x="16" y="55">// Modernize</text><text x="16" y="68">// Deliver</text>
      <text x="16" y="92">const developer = {</text>
      <text x="28" y="106" fill="#a8d8ff">location: "Uruguay",</text>
      <text x="28" y="119" fill="#a8d8ff">focus: ["Backend", "APIs"],</text>
      <text x="28" y="132" fill="#a8d8ff">mode: "real-world"</text>
      <text x="16" y="145">};</text>
      <text x="16" y="160">while (ideas) ship();</text>
    </g>
  </g>

  <!-- Main identity -->
  <text x="610" y="86" text-anchor="middle" fill="url(#name)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="43" font-weight="700">Luis A. Hernández Elias</text>
  <line x1="390" y1="105" x2="555" y2="105" stroke="#0ea5e9" stroke-opacity="0.7"/>
  <text x="610" y="112" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">&lt;/&gt;</text>
  <line x1="665" y1="105" x2="830" y2="105" stroke="#0ea5e9" stroke-opacity="0.7"/>

  <text x="610" y="142" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600">Software Developer · Backend &amp; APIs · Legacy Modernization</text>
  <text x="610" y="168" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">.NET · Laravel · TypeScript/NestJS · Kotlin · React · Clean Architecture</text>
  <text x="610" y="195" text-anchor="middle" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Based in Uruguay · Building and modernizing software for real business workflows</text>

  <!-- Visual link row; real clickable links remain below banner in README -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#38bdf8">
    <text x="465" y="228">▣ Portfolio</text>
    <text x="590" y="228">● Selected projects</text>
    <text x="760" y="228">✉ Contact</text>
  </g>

  <!-- Right-side software/Uruguay motif -->
  <g transform="translate(990 50)">
    <path d="M44 0 L74 18 L88 48 L70 76 L58 108 L40 136 L26 111 L18 82 L4 54 L14 28 Z" fill="#0ea5e9" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.35"/>
    <g fill="#38bdf8" opacity="0.62">
      <circle cx="36" cy="20" r="2"/><circle cx="49" cy="28" r="2"/><circle cx="61" cy="38" r="2"/><circle cx="69" cy="52" r="2"/><circle cx="56" cy="62" r="2"/><circle cx="47" cy="76" r="2"/><circle cx="52" cy="91" r="2"/><circle cx="40" cy="106" r="2"/><circle cx="34" cy="121" r="2"/>
    </g>
    <circle cx="47" cy="119" r="4" fill="#67e8f9" filter="url(#glow)"/>
    <line x1="55" y1="119" x2="95" y2="119" stroke="#38bdf8" stroke-opacity="0.8"/>
    <text x="102" y="116" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">URUGUAY</text>
    <text x="102" y="134" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">IDEAS · CODE · IMPACT</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#64748b" font-size="9" letter-spacing="1">
    <text x="1035" y="24">BETTER SYSTEMS</text>
    <text x="1035" y="38">CLEANER CODE</text>
    <text x="1035" y="52">REAL PROGRESS</text>
  </g>

  <!-- Bottom wireframe glow -->
  <g fill="none" stroke="#0ea5e9" stroke-opacity="0.28">
    <path d="M0 260 Q170 212 340 260 T680 260 T1020 260 T1200 260"/>
    <path d="M0 275 Q170 230 340 275 T680 275 T1020 275 T1200 275"/>
    <path d="M0 290 Q170 246 340 290 T680 290 T1020 290 T1200 290"/>
  </g>
</svg>
